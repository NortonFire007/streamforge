services:
  postgres:
    image: postgres:17
    container_name: streamforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamforge}
      POSTGRES_USER: ${POSTGRES_USER:-streamforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamforge} -d ${POSTGRES_DB:-streamforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
